site:
  title: OpenDMI
  start_page: opendmi::index.adoc

# Site is built from the repository it lives in, including the changes which
# are not committed yet
content:
  sources:
  - url: ..
    branches: HEAD
    start_path: website

asciidoc:
  attributes:
    url-repo: https://github.com/sdnvx/opendmi-ng

antora:
  extensions:
  - '@antora/collector-extension'

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  # Header and footer of the default UI are its own demo, which the ones of
  # the project replace
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site
