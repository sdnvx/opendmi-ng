name: macOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macos-${{ matrix.arch }}-${{ matrix.c_compiler }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, x86_64 ]
        c_compiler: [ gcc, clang ]
        build_type: [ Release ]
        # Code under x86-only conditions, such as the memory scan of the
        # generic backend, is compiled on Intel runners alone
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-26-intel

    steps:
    - uses: actions/checkout@v4

    - name: Check architecture
      run: test "$(uname -m)" = "${{ matrix.arch }}"

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
