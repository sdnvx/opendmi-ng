name: CMake on BSD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: freebsd-${{ matrix.release }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        release: [ "14.3", "15.0" ]

    steps:
    - uses: actions/checkout@v4

    - name: Build and test
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.release }}
        usesh: true
        prepare: |
          pkg install -y cmake git pkgconf ncurses libxml2 libyaml yajl
        # System compiler (clang) is used
        run: |
          set -e
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          cd build
          ctest --output-on-failure

  netbsd:
    name: netbsd-${{ matrix.release }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        release: [ "10.1" ]

    steps:
    - uses: actions/checkout@v4

    - name: Build and test
      uses: vmactions/netbsd-vm@v1
      with:
        release: ${{ matrix.release }}
        usesh: true
        prepare: |
          export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -d_ -f1)/All"
          /usr/sbin/pkg_add pkgin
          pkgin -y install cmake git pkgconf ncurses libxml2 libyaml yajl gcc14
        # System compiler (GCC 10) does not support C23, so GCC 14 from pkgsrc is used
        run: |
          set -e
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/pkg/gcc14/bin/gcc
          cmake --build build --parallel 2
          cd build
          ctest --output-on-failure
