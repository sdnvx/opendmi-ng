name: NetBSD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: netbsd-${{ matrix.release }}
    runs-on: ubuntu-latest
    # VM boot hangs should not hold the runner for the default 6 hours
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # NetBSD 10 panics at early boot with host CPU model on some runners
        # (vmactions/netbsd-vm#21), so its first boot times out and the VM is
        # restarted with a conservative CPU model, which takes a few minutes
        release: [ "10.1", "11.0" ]

    steps:
    - uses: actions/checkout@v4

    - name: Build and test
      uses: vmactions/netbsd-vm@v1
      with:
        release: ${{ matrix.release }}
        prepare: |
          export PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/$(uname -r | cut -d_ -f1)/All"
          /usr/sbin/pkg_add pkgin
          pkgin -y install cmake pkgconf ncurses libxml2 libyaml yajl gcc14
        # System compiler does not support C23, so GCC 14 from pkgsrc is used
        run: |
          set -e
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/pkg/gcc14/bin/gcc
          cmake --build build --parallel 2
          cd build
          ctest --output-on-failure
