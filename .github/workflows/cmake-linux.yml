name: Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests run under AddressSanitizer, which on Linux includes LeakSanitizer,
  # in both build types. The project enables it in debug builds only, so that
  # the release builds of packages never carry it, hence the flags of the
  # release builds of CI are passed here.
  build:
    name: linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        c_compiler: [ gcc, clang ]
        build_type: [ Release, Debug ]

    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      CFLAGS: ${{ matrix.build_type == 'Release' && '-fsanitize=address -fno-omit-frame-pointer' || '' }}
      CXXFLAGS: ${{ matrix.build_type == 'Release' && '-fsanitize=address -fno-omit-frame-pointer' || '' }}
      LDFLAGS: ${{ matrix.build_type == 'Release' && '-fsanitize=address' || '' }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DENABLE_ASAN=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
        -DENABLE_WERROR=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --parallel 4
