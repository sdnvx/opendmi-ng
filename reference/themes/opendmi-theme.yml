extends: default
font:
  catalog:
    IBM Plex Serif:
      normal: ibm-plex-serif/IBMPlexSerif-Regular.otf
      bold: ibm-plex-serif/IBMPlexSerif-SemiBold.otf
      italic: ibm-plex-serif/IBMPlexSerif-Italic.otf
      bold_italic: ibm-plex-serif/IBMPlexSerif-SemiBoldItalic.otf
    IBM Plex Sans:
      normal: ibm-plex-sans/IBMPlexSans-Regular.otf
      bold: ibm-plex-sans/IBMPlexSans-SemiBold.otf
      italic: ibm-plex-sans/IBMPlexSans-Italic.otf
      bold_italic: ibm-plex-sans/IBMPlexSans-SemiBoldItalic.otf
    IBM Plex Mono:
      normal: ibm-plex-mono/IBMPlexMono-Regular.otf
      bold: ibm-plex-mono/IBMPlexMono-SemiBold.otf
      italic: ibm-plex-mono/IBMPlexMono-Italic.otf
      bold_italic: ibm-plex-mono/IBMPlexMono-SemiBoldItalic.otf
base:
  font-family: IBM Plex Serif
  font-size: 10
# Size of the code blocks is derived from the base font size in the default
# theme, and is fixed there before the base size is overridden. Plex Mono has
# the same x-height as Plex Serif, so the same size makes them look even
code:
  font-family: IBM Plex Mono
  font-size: $base-font-size
codespan:
  font-family: $code-font-family
page:
  size: A4
# Title page has no place of its own for the copyright, and the authors are
# the only part of it the theme gives the content of. The revision is written
# there too, so that the copyright goes last, the way it does on the title
# pages of books. Holder and years come from the copyright attribute of the
# book. Lines of the attributes the book does not set are left out, so the
# notice is kept on a single line of its own, breaking inside the smaller
# text, and goes as a whole rather than leaving half of the markup behind
title-page:
  authors:
    content: "{author} +\n{version-label} {revnumber}, {revdate} +\n +\n[.copyright]#Copyright {copyright}.pass:[<br>]Free use of this software is granted under the terms of the BSD 3-Clause License.#"
  revision:
    display: none
role:
  copyright:
    font-size: 8
